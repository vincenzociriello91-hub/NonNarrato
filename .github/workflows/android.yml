name: Compila APK

# A ogni modifica su main: prova automatica, APK Android firmato e nuova versione di prova
# nelle Release del repository. I registri dell'ultima compilazione finiscono sempre nel ramo
# "log-compilazione", così si possono leggere senza entrare nella pagina delle Actions.
#
# Usa solo ciò che è già sulla macchina di GitHub (git, Java 17, Android SDK, gh) più Godot,
# scaricato dalle versioni ufficiali: nessuna immagine o azione di terzi da tenere aggiornata.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compila-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.7.2
      VERSIONE: 0.1.${{ github.run_number }}
    steps:
      - name: Scarica il codice
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          mkdir -p build

      - name: Prepara Godot
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          modelli="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "${RUNNER_TEMP}/godot" "${modelli}" "${HOME}/.config/godot"
          cd "${RUNNER_TEMP}/godot"
          curl -sSL --fail --retry 3 -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL --fail --retry 3 -o modelli.tpz "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          unzip -q -j modelli.tpz "templates/android_release.apk" "templates/android_debug.apk" "templates/version.txt" -d "${modelli}"
          rm -f godot.zip modelli.tpz
          echo "${RUNNER_TEMP}/godot" >> "${GITHUB_PATH}"
          java_17="${JAVA_HOME_17_X64:-${JAVA_HOME}}"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/java_sdk_path = \"${java_17}\""
            echo "export/android/android_sdk_path = \"${ANDROID_HOME}\""
          } > "${HOME}/.config/godot/editor_settings-4.7.tres"
          {
            ./godot --version
            echo "java: ${java_17}"
            echo "android sdk: ${ANDROID_HOME}"
            ls "${ANDROID_HOME}/build-tools"
            ls "${modelli}"
          } 2>&1 | tee "${GITHUB_WORKSPACE}/build/registro_godot.txt"

      - name: Numero di versione
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"${VERSIONE}\"/" export_presets.cfg
          sed -i "s/^config\/version=.*/config\/version=\"${VERSIONE}\"/" project.godot
          grep -E "^version/|^config/version" export_presets.cfg project.godot

      - name: Importa le risorse
        shell: bash
        run: |
          set -o pipefail
          # Due passate: la prima crea la cache e l'elenco delle classi, la seconda la completa.
          godot --headless --path . --import 2>&1 | tee build/registro_import.txt || true
          godot --headless --path . --import 2>&1 | tee -a build/registro_import.txt

      - name: Prova automatica
        shell: bash
        run: |
          set -o pipefail
          timeout 900 godot --headless --fixed-fps 60 --path . -- --prova 2>&1 | tee build/registro_prova.txt
          grep -q "PROVA FINE falliti: 0" build/registro_prova.txt

      - name: Esporta l'APK
        shell: bash
        env:
          CHIAVE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          CHIAVE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          CHIAVE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -n "${CHIAVE_BASE64:-}" ]; then
            echo "${CHIAVE_BASE64}" | base64 -d > "${RUNNER_TEMP}/chiave.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="${RUNNER_TEMP}/chiave.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="${CHIAVE_ALIAS}"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="${CHIAVE_PASSWORD}"
            echo "Firma: chiave segreta"
          else
            # Chiave del canale di prova: pubblica per scelta (vedi README).
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="${GITHUB_WORKSPACE}/distribuzione/chiave_prova.keystore"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="nonnarrato-prova"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="nonnarrato-prova"
            echo "Firma: chiave di prova"
          fi
          godot --headless --path . --export-release "Android" build/NonNarrato.apk 2>&1 | tee build/registro_export.txt
          test -s build/NonNarrato.apk
          firmatore=$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)/apksigner
          "${firmatore}" verify --print-certs build/NonNarrato.apk 2>&1 | tee -a build/registro_export.txt
          ls -la build

      - name: Pubblica la versione di prova
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Le note sono la prima sezione di distribuzione/NOVITA.md.
          awk '/^## /{n++} n==1' distribuzione/NOVITA.md > build/note.md
          gh release create "prova-${VERSIONE}" build/NonNarrato.apk \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "NonNarrato ${VERSIONE} (prova)" --notes-file build/note.md --latest 2>&1 | tee build/registro_pubblica.txt

      - name: Salva i registri nel ramo log-compilazione
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p "${RUNNER_TEMP}/registri"
          cp build/*.txt "${RUNNER_TEMP}/registri/" 2>/dev/null || true
          cd "${RUNNER_TEMP}/registri"
          echo "compilazione ${GITHUB_RUN_NUMBER} - commit ${GITHUB_SHA} - $(date -u)" > quando.txt
          git init -q -b log-compilazione .
          git config user.name "compilazione"
          git config user.email "compilazione@users.noreply.github.com"
          git add -A
          git commit -q -m "Registri della compilazione ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" log-compilazione
